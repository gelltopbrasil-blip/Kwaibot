name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar projeto Android
        run: |
          mkdir -p project && cd project
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KwaiAutoScroll"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.kwaiautoscroll"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.kwaiautoscroll"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AutoScrollService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Kwai Auto Scroll</string>
              <string name="service_desc">Rola automaticamente os vídeos do Kwai em intervalos definidos.</string>
          </resources>
          EOF
          mkdir -p app/src/main/java/com/example/kwaiautoscroll
          cat > app/src/main/java/com/example/kwaiautoscroll/AutoScrollService.kt <<'EOF'
          package com.example.kwaiautoscroll

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.random.Random

          class AutoScrollService : AccessibilityService() {

              companion object {
                  var instance: AutoScrollService? = null

                  // ---- CONFIGURAÇÕES (ajuste aqui) ----
                  var minSeconds = 10            // tempo mínimo assistindo cada vídeo
                  var maxSeconds = 20            // tempo máximo assistindo cada vídeo
                  const val SWIPE_DURATION_MS = 300L
                  const val SWIPE_START_Y = 0.75f // início do swipe (% da altura)
                  const val SWIPE_END_Y = 0.25f   // fim do swipe (% da altura)

                  // Pacotes do Kwai
                  val targetPackages = setOf(
                      "com.kwai.bulldog", "com.kwai.video", "com.kuaishou.nebula", "com.smile.gifmaker"
                  )
                  // true = só rola quando o Kwai está na tela; false = rola em qualquer app (para testar)
                  const val ONLY_KWAI = true
                  // -------------------------------------

                  var running = false
                      private set
              }

              private val handler = Handler(Looper.getMainLooper())
              private var currentPackage = ""

              private var overlay: LinearLayout? = null
              private var btnStart: Button? = null
              private var btnStop: Button? = null

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      if (isKwaiOnScreen()) swipeUp()
                      handler.postDelayed(this, nextDelay())
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun nextDelay(): Long {
                  val lo = minSeconds.coerceAtLeast(1)
                  val hi = maxSeconds.coerceAtLeast(lo)
                  return Random.nextLong(lo * 1000L, hi * 1000L + 1)
              }

              fun start() {
                  running = true
                  handler.removeCallbacks(loop)
                  handler.postDelayed(loop, nextDelay())
                  updateOverlayState()
              }

              fun stop() {
                  running = false
                  handler.removeCallbacks(loop)
                  updateOverlayState()
              }

              // ---------- Botões flutuantes ----------

              fun showOverlay() {
                  if (overlay != null) return
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(6), dp(6), dp(8), dp(6))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#CC202020"))
                          cornerRadius = dp(24).toFloat()
                      }
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(8)
                      y = resources.displayMetrics.heightPixels / 3
                  }

                  fun makeButton(label: String, color: Int, onClick: () -> Unit): Button =
                      Button(this).apply {
                          text = label
                          textSize = 12f
                          setTextColor(Color.WHITE)
                          isAllCaps = true
                          minWidth = 0
                          minimumWidth = 0
                          minHeight = 0
                          minimumHeight = 0
                          setPadding(dp(12), 0, dp(12), 0)
                          background = GradientDrawable().apply {
                              setColor(color)
                              cornerRadius = dp(18).toFloat()
                          }
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, dp(36)
                          ).apply { marginStart = dp(6) }
                          setOnClickListener { onClick() }
                      }

                  // Alça para arrastar os botões
                  val handle = TextView(this).apply {
                      text = "✥"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      setPadding(dp(8), 0, dp(8), 0)
                  }
                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = e.rawX
                              touchY = e.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (e.rawX - touchX).toInt()
                              params.y = startY + (e.rawY - touchY).toInt()
                              try { wm.updateViewLayout(box, params) } catch (_: Exception) {}
                              true
                          }
                          else -> false
                      }
                  }

                  val bStart = makeButton("START", Color.parseColor("#2E7D32")) { start() }
                  val bStop = makeButton("STOP", Color.parseColor("#C62828")) { stop() }
                  val bHide = makeButton("✕", Color.parseColor("#616161")) {
                      stop()
                      hideOverlay()
                  }

                  box.addView(handle)
                  box.addView(bStart)
                  box.addView(bStop)
                  box.addView(bHide)

                  try {
                      wm.addView(box, params)
                      overlay = box
                      btnStart = bStart
                      btnStop = bStop
                      updateOverlayState()
                  } catch (_: Exception) {
                  }
              }

              fun hideOverlay() {
                  val view = overlay ?: return
                  try {
                      (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(view)
                  } catch (_: Exception) {
                  }
                  overlay = null
                  btnStart = null
                  btnStop = null
              }

              private fun updateOverlayState() {
                  btnStart?.alpha = if (running) 0.35f else 1f
                  btnStop?.alpha = if (running) 1f else 0.35f
              }

              // ---------- Rolagem ----------

              private fun isKwaiOnScreen(): Boolean {
                  if (!ONLY_KWAI) return true
                  val pkg = rootInActiveWindow?.packageName?.toString() ?: currentPackage
                  return pkg in targetPackages || pkg.contains("kwai", ignoreCase = true)
              }

              private fun swipeUp() {
                  val m = resources.displayMetrics
                  val x = m.widthPixels / 2f
                  val path = Path().apply {
                      moveTo(x, m.heightPixels * SWIPE_START_Y)
                      lineTo(x, m.heightPixels * SWIPE_END_Y)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, SWIPE_DURATION_MS))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      val pkg = event.packageName?.toString() ?: ""
                      if (pkg != packageName) currentPackage = pkg
                  }
              }

              override fun onInterrupt() {}

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onDestroy() {
                  stop()
                  hideOverlay()
                  instance = null
                  super.onDestroy()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/kwaiautoscroll
          cat > app/src/main/java/com/example/kwaiautoscroll/MainActivity.kt <<'EOF'
          package com.example.kwaiautoscroll

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  fun label(t: String) = TextView(this).apply { text = t }
                  fun numberField(v: Int) = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(v.toString())
                  }
                  fun button(t: String, onClick: () -> Unit) = Button(this).apply {
                      text = t
                      setOnClickListener { onClick() }
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  }

                  val minField = numberField(AutoScrollService.minSeconds)
                  val maxField = numberField(AutoScrollService.maxSeconds)

                  fun applyTimes() {
                      AutoScrollService.minSeconds = minField.text.toString().toIntOrNull() ?: 10
                      AutoScrollService.maxSeconds = maxField.text.toString().toIntOrNull() ?: 20
                  }

                  fun needService(): AutoScrollService? {
                      val s = AutoScrollService.instance
                      if (s == null) {
                          Toast.makeText(this, "Ative o serviço de acessibilidade primeiro", Toast.LENGTH_LONG).show()
                      }
                      return s
                  }

                  root.addView(label("1) Ative o serviço de acessibilidade do app"))
                  root.addView(button("Abrir acessibilidade") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })

                  root.addView(label("\n2) Tempo por vídeo (segundos)"))
                  root.addView(label("Mínimo"))
                  root.addView(minField)
                  root.addView(label("Máximo"))
                  root.addView(maxField)

                  root.addView(label("\n3) Botões flutuantes (START / STOP sobre o Kwai)"))
                  root.addView(button("Mostrar botões flutuantes") {
                      val s = needService()
                      if (s != null) {
                          applyTimes()
                          s.showOverlay()
                          Toast.makeText(this, "Abra o Kwai e use START / STOP", Toast.LENGTH_SHORT).show()
                      }
                  })
                  root.addView(button("Ocultar botões flutuantes") {
                      AutoScrollService.instance?.hideOverlay()
                  })

                  root.addView(label("\n4) Controle pelo app"))
                  root.addView(button("Iniciar") {
                      val s = needService()
                      if (s != null) {
                          applyTimes()
                          s.start()
                          Toast.makeText(this, "Iniciado. Abra o Kwai.", Toast.LENGTH_SHORT).show()
                      }
                  })
                  root.addView(button("Parar") {
                      AutoScrollService.instance?.stop()
                      Toast.makeText(this, "Parado", Toast.LENGTH_SHORT).show()
                  })

                  root.addView(label("\n5) Encerrar"))
                  root.addView(button("Fechar tudo") {
                      AutoScrollService.instance?.let {
                          it.stop()
                          it.hideOverlay()
                          it.disableSelf() // desliga o serviço de acessibilidade
                      }
                      Toast.makeText(
                          this,
                          "Tudo fechado. Para usar de novo, ative a acessibilidade.",
                          Toast.LENGTH_LONG
                      ).show()
                      finishAffinity()
                  })

                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kwai-auto-scroll-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
